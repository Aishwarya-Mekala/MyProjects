
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My To-Do List</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <main class="app">
        <h1>My To-Do List 📝</h1>
        <p>Plan your day, one task at a time.</p>

        <form id="taskForm">
            <input
                type="text"
                id="taskInput"
                placeholder="Enter a new task..."
                maxlength="150"
                required
            >
            <button type="submit">Add</button>
        </form>

        <p id="taskCount">0 tasks remaining</p>

        <ul id="taskList"></ul>

        <button id="clearCompleted" class="clear">
            Clear Completed
        </button>
    </main>
</body>
</html>
