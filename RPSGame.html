
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

    <div class="game-container">
        <h1>✊ Rock Paper Scissors ✌️</h1>
        <p class="subtitle">Play against the computer!</p>

        <div class="choices">
            <button class="choice" data-choice="rock">✊<span>Rock</span></button>
            <button class="choice" data-choice="paper">✋<span>Paper</span></button>
            <button class="choice" data-choice="scissors">✌️<span>Scissors</span></button>
        </div>

        <div class="result-box">
            <p id="playerChoice">Your choice: —</p>
            <p id="computerChoice">Computer's choice: —</p>
            <h2 id="result">Choose your move!</h2>
        </div>

        <div class="scoreboard">
            <div>
                <h3 id="playerScore">0</h3>
                <p>You</p>
            </div>
            <div>
                <h3 id="computerScore">0</h3>
                <p>Computer</p>
            </div>
        </div>

        <button id="resetButton">🔄 Reset Game</button>
    </div>

</body>
</html>
